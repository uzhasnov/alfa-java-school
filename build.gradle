plugins {
    id 'java'
}

group = 'ru.alfabank'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'net.datafaker:datafaker:2.5.4'
    implementation 'com.github.lalyos:jfiglet:0.0.8'
    implementation 'io.cucumber:cucumber-java:7.34.6'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.34.6'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation 'io.rest-assured:rest-assured:5.3.0'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.codeborne:selenide:7.18.0'
    testImplementation 'io.qameta.allure:allure-junit5:2.35.4'
    implementation 'org.aspectj:aspectjweaver:1.9.22.1'
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    agent 'org.aspectj:aspectjweaver:1.9.22.1'
}

test {
    useJUnitPlatform()
    jvmArgs = [ "-javaagent:${configurations.agent.singleFile}" ]
    testLogging {
        lifecycle {
            events "started", "passed", "skipped", "failed", "standardOut", "standardError"
        }
    }
}